name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  # The job id is a required status check on main and dev; keep it as `build`.
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false
      # CRA runs ESLint during the build; with CI=true any warning fails it.
      - run: npm run build
